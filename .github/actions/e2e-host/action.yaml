name: Prepare an e2e host
description: Enables KVM and installs libvirt so wendy can run machines on a GitHub-hosted runner.
runs:
  using: composite
  steps:
    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Install libvirt
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends libvirt-daemon-system qemu-system-x86 ovmf
        # Group membership would only apply to a new login session.
        sudo chmod 0666 /var/run/libvirt/libvirt-sock
