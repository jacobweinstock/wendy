name: Nightly e2e
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned by commit SHA, with the version in a comment, so a moved
# tag cannot change what runs.

jobs:
  lifecycle:
    name: Self-e2e (lifecycle)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Prepare the host
        uses: ./.github/actions/e2e-host

      - name: Build
        run: make build

      - name: Run lifecycle
        run: ./bin/wendy run --env quickstart --suite lifecycle --plain --data "$RUNNER_TEMP/wendy"

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lifecycle-run
          path: ${{ runner.temp }}/wendy/runs
          if-no-files-found: ignore
