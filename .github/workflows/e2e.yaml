name: E2E
on:
  workflow_call:
    inputs:
      plan:
        description: The plan to run.
        type: string
        required: true
      config:
        description: CUE that wendy loads after its built-ins, such as the plan itself. It starts with a package clause.
        type: string
        default: ""
      combinations:
        description: Glob patterns over the plan's combinations, separated by spaces or commas. Empty runs the plan's own.
        type: string
        default: ""
      suites:
        description: Suites to run, separated by spaces or commas. Empty runs the plan's own.
        type: string
        default: ""
      label-filter:
        description: A Ginkgo label filter, ANDed with each combination's own.
        type: string
        default: ""
      runner:
        description: The runner label every combination runs on.
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: How long one combination may take.
        type: number
        default: 120

permissions:
  contents: read

# Actions are pinned by commit SHA, with the version in a comment, so a moved
# tag cannot change what runs.

jobs:
  # Wendy is built and the plan checked once, so a bad config fails here rather
  # than on every runner.
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      # Wendy runs from the bundle, outside the checkout, so it loads its
      # built-ins and this config and nothing from the checkout's .wendy.
      - name: Bundle wendy and the config
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          mkdir -p "$RUNNER_TEMP/bundle/config"
          cp bin/wendy "$RUNNER_TEMP/bundle/"
          if [ -n "$CONFIG" ]; then
            printf '%s\n' "$CONFIG" > "$RUNNER_TEMP/bundle/config/e2e.cue"
          fi

      - name: Plan
        id: plan
        working-directory: ${{ runner.temp }}/bundle
        env:
          PLAN: ${{ inputs.plan }}
          COMBINATIONS: ${{ inputs.combinations }}
          SUITES: ${{ inputs.suites }}
          LABEL_FILTER: ${{ inputs.label-filter }}
        run: |
          args=(--plan "$PLAN" --config config --data "$RUNNER_TEMP/wendy")
          IFS=', ' read -ra patterns <<< "$COMBINATIONS"
          for p in "${patterns[@]}"; do args+=(--combination "$p"); done
          IFS=', ' read -ra suites <<< "$SUITES"
          for s in "${suites[@]}"; do args+=(--suite "$s"); done
          if [ -n "$LABEL_FILTER" ]; then args+=(--label-filter "$LABEL_FILTER"); fi
          if ! ./wendy plan "${args[@]}" --json > "$RUNNER_TEMP/plan.json"; then
            # When the plan's own file has errors, wendy plan only says the
            # plan is unknown; vet says what the errors are. Its host checks
            # are about this runner, not the ones the combinations run on.
            ./wendy vet --offline --config config --data "$RUNNER_TEMP/wendy" | sed '/^Host /,$d' || true
            exit 1
          fi

          # A testbed without a matrix has no combination to pick, so a lone
          # combination nobody picked runs as the plan selects it.
          matrix=$(jq -c --arg patterns "$COMBINATIONS" '.preview.combinations | length as $n
            | {include: [.[] | {combination: .name, pattern: (if $n > 1 or $patterns != "" then .name else "" end)}]}' "$RUNNER_TEMP/plan.json")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          {
            jq -r --arg plan "$PLAN" '.preview
              | "### \($plan): \(.combinations | length) combination(s), one runner each", "",
                ([.combinations[] | "`\(.name)`"] | join(" · ")), "",
                (.combinations[0].suites[] | "**\(.name)**: \([.tests[] | .name + (if .skip then " (skipped: \(.skip))" else "" end)] | join(" › "))"),
                "", "Each runner needs \(.needs.vms) VMs · \((.needs.ramMiB + 1023) / 1024 | floor) GiB RAM · \(.needs.diskGiB) GiB disk",
                (if .builds then "", "Builds: " + ([.builds[] | "\(.component) from \(.source.repo) \(.source.ref // "")"] | join(", ")) else empty end),
                (.warnings // [] | .[] | "", "> [!WARNING]", "> \(.)")' "$RUNNER_TEMP/plan.json"
            if [ -s config/e2e.cue ]; then
              printf '\n<details><summary>Config</summary>\n\n```cue\n%s\n```\n\n</details>\n' "$(cat config/e2e.cue)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wendy-bundle
          path: ${{ runner.temp }}/bundle
          retention-days: 1

  run:
    name: ${{ matrix.combination }}
    needs: prepare
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      # One combination's failure must not cancel the others: each result is
      # worth having.
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Building Tinkerbell or CAPT from source needs Go.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wendy-bundle
          path: ${{ runner.temp }}/bundle

      - name: Prepare the host
        uses: ./.github/actions/e2e-host

      - name: Run
        working-directory: ${{ runner.temp }}/bundle
        env:
          PLAN: ${{ inputs.plan }}
          PATTERN: ${{ matrix.pattern }}
          SUITES: ${{ inputs.suites }}
          LABEL_FILTER: ${{ inputs.label-filter }}
        run: |
          # Artifacts do not keep the execute bit.
          chmod +x wendy
          args=(--plan "$PLAN" --config config --data "$RUNNER_TEMP/wendy" --plain)
          if [ -n "$PATTERN" ]; then args+=(--combination "$PATTERN"); fi
          IFS=', ' read -ra suites <<< "$SUITES"
          for s in "${suites[@]}"; do args+=(--suite "$s"); done
          if [ -n "$LABEL_FILTER" ]; then args+=(--label-filter "$LABEL_FILTER"); fi
          ./wendy run "${args[@]}"

      # An execution directory is self-contained: download it into
      # <data>/executions and browse it with wendy serve --data <data>.
      - name: Upload the execution
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.combination }}
          path: ${{ runner.temp }}/wendy/executions
          if-no-files-found: ignore
          # A re-run of a failed combination replaces its result.
          overwrite: true

  report:
    name: Report
    needs: [prepare, run]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the executions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-*
          path: ${{ runner.temp }}/results

      - name: Summarize
        env:
          MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: |
          # A lone artifact is downloaded without a directory of its own, so
          # each execution is found by the combination it records.
          mkdir -p "$RUNNER_TEMP/results"
          cd "$RUNNER_TEMP/results"
          shopt -s globstar nullglob
          declare -A executions
          for f in **/execution.json; do
            executions[$(jq -r '.combinations[0].name' "$f")]=$f
          done

          rows=() passed=0 total=0
          while read -r combination; do
            total=$((total + 1))
            file=${executions[$combination]:-}
            if [ -z "$file" ]; then
              rows+=("| – no result | \`$combination\` | | The runner left no execution; see its job log. |")
              continue
            fi
            if [ "$(jq -r '.combinations[0].status' "$file")" = passed ]; then passed=$((passed + 1)); fi
            rows+=("$(jq -r '.combinations[0] as $c
              | ({passed: "✓ passed", failed: "✗ failed", errored: "! errored", timedout: "✗ timed out", cancelled: "⊘ cancelled", skipped: "– skipped"}[$c.status] // $c.status) as $verdict
              | (($c.ms // 0) / 1000 | floor) as $s
              | "| \($verdict) | `\($c.name)` | \($s / 60 | floor)m \($s % 60)s | "
                + (if $c.failure then ($c.failure.path | join(" › ")) + ": " + ($c.failure.msg | gsub("[\r\n]+"; " ") | .[0:300] | gsub("\\|"; "\\|")) else "" end)
                + " |"' "$file")")
          done < <(jq -r '.include[].combination' <<< "$MATRIX")

          {
            echo "### Results: $passed of $total passed"
            echo
            echo "| Verdict | Combination | Took | Failure |"
            echo "|---|---|---|---|"
            printf '%s\n' "${rows[@]}"
            echo
            echo "To browse a combination in wendy's web UI:"
            echo
            echo '```sh'
            echo "gh run download $GITHUB_RUN_ID -R $GITHUB_REPOSITORY -n e2e-<combination> -D wendy/executions"
            echo "wendy serve --data wendy"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
