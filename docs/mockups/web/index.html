<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wendy · UX redesign mockup</title>
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.documentElement.classList.add("dark");
    }
  })();
</script>
<link rel="stylesheet" href="static/wendy.css">
<style>
  /* Mockup-only additions on top of wendy.css. */
  .mock { position:fixed; left:12px; bottom:12px; z-index:20; font-size:13px; }
  .mock > button { border:1px dashed var(--accent); background:var(--surface); color:var(--ink); border-radius:16px; padding:5px 12px; cursor:pointer; box-shadow:0 2px 8px var(--shadow); font:inherit; }
  .mock .menu { position:absolute; bottom:38px; left:0; width:300px; max-height:75vh; overflow:auto; background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:0 10px 40px var(--shadow); padding:6px; }
  .mock .menu a, .mock .menu label { display:block; padding:4px 8px; border-radius:4px; text-decoration:none; cursor:pointer; }
  .mock .menu a:hover, .mock .menu label:hover { background:var(--hover); }
  .mock .menu .h { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); padding:8px 8px 2px; }
  .savebar { padding-left:140px; }
  .banner { border:2px solid var(--pause); border-radius:8px; padding:12px 14px; margin-bottom:14px; background:var(--surface); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .kv th { width:180px; white-space:nowrap; }
  .runform .field { align-items:flex-start; }
  .runform .field label.k { width:170px; flex:none; padding-top:5px; }
  .partrow { display:flex; gap:8px; align-items:baseline; margin:2px 0; }
  .partrow .kind { width:140px; color:var(--mute); flex:none; }
  .h4 { font-size:13px; font-weight:600; margin:26px 0 2px; padding-bottom:4px; border-bottom:1px solid var(--line-soft); }
  .toast[hidden] { display:none; }
  .tree .grp { font-size:12px; margin:8px 6px 2px; color:var(--mute); }
  .disabled-why { font-size:12px; color:var(--mute); margin-left:6px; }
  h2.title { margin:0; font-size:18px; }
</style>
</head>
<body>
  <nav class="top" id="top"></nav>
  <div id="main"></div>

  <div id="palette" class="overlay" hidden>
    <div class="palette">
      <input id="palette-input" placeholder="Run a plan, open an execution, go to…" autocomplete="off" aria-label="Command palette">
      <div id="palette-list"></div>
      <div class="it mute" style="border-top:1px solid var(--line-soft);font-size:12px;cursor:default">
        <span><span class="kbd">↑↓</span> move &nbsp;<span class="kbd">enter</span> open &nbsp;<span class="kbd">esc</span> close</span>
      </div>
    </div>
  </div>

  <div id="help" class="overlay" hidden>
    <div class="help">
      <h3 style="margin:0 0 8px">Keys</h3>
      <table>
        <tr><td><span class="kbd">1</span>–<span class="kbd">5</span></td><td>Home, Executions, Plans, Testbeds, Tests</td></tr>
        <tr><td><span class="kbd">r</span></td><td>Run tests…</td></tr>
        <tr><td><span class="kbd">/</span></td><td>Filter this list</td></tr>
        <tr><td><span class="kbd">⌘K</span> or <span class="kbd">:</span></td><td>Command palette</td></tr>
        <tr><td><span class="kbd">?</span></td><td>This help</td></tr>
        <tr><td><span class="kbd">esc</span></td><td>Close</td></tr>
      </table>
    </div>
  </div>

  <div class="mock" id="mock">
    <div class="menu" id="mock-menu" hidden></div>
    <button type="button" id="mock-btn">Mockup ▴</button>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="screens.js"></script>
</body>
</html>
